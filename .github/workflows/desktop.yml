# Vitalog desktop builds. Installers are unsigned.
# macOS notarization and Windows Authenticode need Apple/Windows secrets later.
# A push to main publishes the installers on the GitHub Release for this version.
name: desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan git history
        run: gitleaks detect --source . --redact --exit-code 1

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Test
        working-directory: app
        run: flutter test

  desktop:
    name: Build ${{ matrix.platform }}
    needs: [secrets, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Linux desktop libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build macOS
        if: matrix.platform == 'macos'
        working-directory: app
        run: flutter build macos --release

      - name: Pack macOS
        if: matrix.platform == 'macos'
        working-directory: app/build/macos/Build/Products/Release
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' "$GITHUB_WORKSPACE/app/pubspec.yaml" | cut -d+ -f1)
          hdiutil create -volname Vitalog -srcfolder Vitalog.app -ov -format UDZO "$GITHUB_WORKSPACE/Vitalog-${version}.dmg"
          echo "VITALOG_INSTALLER=$GITHUB_WORKSPACE/Vitalog-${version}.dmg" >> "$GITHUB_ENV"

      - name: Build Windows
        if: matrix.platform == 'windows'
        working-directory: app
        shell: bash
        run: |
          code=0
          flutter build windows --release > "$RUNNER_TEMP/windows-build.txt" 2>&1 || code=$?
          if [ "$code" -ne 0 ]; then
            grep -n -E "error|Error|FAILED|fatal|LNK" "$RUNNER_TEMP/windows-build.txt" | grep -v "available" | tail -40 | while IFS= read -r line; do
              echo "::error::${line:0:300}"
            done
          fi
          exit "$code"

      - name: Pack Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: app/build/windows/x64/runner/Release
        run: |
          $version = ((Select-String -Path "$env:GITHUB_WORKSPACE\app\pubspec.yaml" -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value).Split('+')[0]
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_3_3/innosetup-6.3.3.exe' -OutFile $setup
          Start-Process $setup -ArgumentList '/VERYSILENT /NORESTART /DIR=C:\InnoSetup' -Wait
          & 'C:\InnoSetup\ISCC.exe' "/DAppVersion=$version" "/DSourceDir=$pwd" "/DOutputDir=$env:GITHUB_WORKSPACE" "$env:GITHUB_WORKSPACE\app\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_ENV -Value "VITALOG_INSTALLER=$env:GITHUB_WORKSPACE\Vitalog-$version-setup.exe"

      - name: Pack Windows MSIX (Store)
        if: matrix.platform == 'windows'
        working-directory: app
        shell: pwsh
        run: |
          # Requires msix_config.publisher from Partner Center (not REPLACE_...).
          $pub = (Select-String -Path pubspec.yaml -Pattern '^\s*publisher:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          if ($pub -match 'REPLACE_WITH_PARTNER_CENTER') {
            Write-Host 'Skipping MSIX: set msix_config.publisher from Partner Center Product identity.'
            exit 0
          }
          dart run msix:create --store
          $msix = Get-ChildItem -Recurse -Filter *.msix | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) { throw 'MSIX not produced' }
          Copy-Item $msix.FullName "$env:GITHUB_WORKSPACE\$($msix.Name)"
          Add-Content -Path $env:GITHUB_ENV -Value "VITALOG_MSIX=$env:GITHUB_WORKSPACE\$($msix.Name)"

      - name: Build Linux
        if: matrix.platform == 'linux'
        working-directory: app
        run: flutter build linux --release

      - name: Pack Linux
        if: matrix.platform == 'linux'
        working-directory: app/build/linux/x64/release/bundle
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' "$GITHUB_WORKSPACE/app/pubspec.yaml" | cut -d+ -f1)
          stage="$RUNNER_TEMP/vitalog-deb"
          rm -rf "$stage"
          mkdir -p "$stage/DEBIAN" "$stage/usr/share/applications" "$stage/opt/vitalog"
          cp -a . "$stage/opt/vitalog/"
          cat > "$stage/usr/share/applications/vitalog.desktop" << EOF
          [Desktop Entry]
          Type=Application
          Name=Vitalog
          Exec=/opt/vitalog/vitalog
          Terminal=false
          Categories=Utility;
          EOF
          sed -i 's/^          //' "$stage/usr/share/applications/vitalog.desktop"
          cat > "$stage/DEBIAN/control" << EOF
          Package: vitalog
          Version: ${version}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: BSOC <outreach@bsoc.space>
          Description: Local lab and medicine record
           Vitalog keeps lab results and medicine records on this computer.
          EOF
          sed -i 's/^          //' "$stage/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$stage" "$GITHUB_WORKSPACE/Vitalog-${version}.deb"
          echo "VITALOG_INSTALLER=$GITHUB_WORKSPACE/Vitalog-${version}.deb" >> "$GITHUB_ENV"

      - name: Upload macOS
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ env.VITALOG_INSTALLER }}
          archive: false
          if-no-files-found: error

      - name: Upload Windows
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ env.VITALOG_INSTALLER }}
          archive: false
          if-no-files-found: error

      - name: Upload Windows MSIX
        if: matrix.platform == 'windows' && env.VITALOG_MSIX != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ env.VITALOG_MSIX }}
          archive: false
          if-no-files-found: warn

      - name: Upload Linux
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ env.VITALOG_INSTALLER }}
          archive: false
          if-no-files-found: error

  release:
    name: Unsigned release
    needs: desktop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | cut -d+ -f1)
          tag="v${version}"
          files=$(find dist -type f -print)
          notes="Unsigned desktop installers for Vitalog ${version}. macOS will say the developer cannot be verified. Windows SmartScreen will ask before the setup runs."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files --title "Vitalog ${version}" --notes "$notes" --latest
          fi
