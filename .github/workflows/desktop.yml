# Vitalog desktop builds. Artifacts are unsigned.
# macOS notarization and Windows Authenticode need Apple/Windows secrets later.
# This workflow does not deploy and does not publish a GitHub Release.
name: desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan git history
        run: gitleaks detect --source . --redact --exit-code 1

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Test
        working-directory: app
        run: flutter test

  desktop:
    name: Build ${{ matrix.platform }}
    needs: [secrets, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Linux desktop libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build macOS
        if: matrix.platform == 'macos'
        working-directory: app
        run: flutter build macos --release

      - name: Pack macOS
        if: matrix.platform == 'macos'
        working-directory: app/build/macos/Build/Products/Release
        run: ditto -c -k --keepParent Vitalog.app "$GITHUB_WORKSPACE/Vitalog-macos.zip"

      - name: Build Windows
        if: matrix.platform == 'windows'
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee "$RUNNER_TEMP/windows-build.txt"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E "error:|error C|CMake Error|fatal error|FAILED|LNK[0-9]" "$RUNNER_TEMP/windows-build.txt" | tail -25 | while IFS= read -r line; do
              echo "::error::${line:0:300}"
            done
            tail -15 "$RUNNER_TEMP/windows-build.txt" | while IFS= read -r line; do
              echo "::error::${line:0:300}"
            done
          fi
          exit "$code"

      - name: Pack Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: app/build/windows/x64/runner/Release
        run: Compress-Archive -Path * -DestinationPath "$env:GITHUB_WORKSPACE/Vitalog-windows.zip"

      - name: Build Linux
        if: matrix.platform == 'linux'
        working-directory: app
        run: flutter build linux --release

      - name: Pack Linux
        if: matrix.platform == 'linux'
        working-directory: app/build/linux/x64/release/bundle
        run: tar -czf "$GITHUB_WORKSPACE/Vitalog-linux.tar.gz" .

      - name: Upload macOS
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Vitalog-macos
          path: Vitalog-macos.zip
          if-no-files-found: error

      - name: Upload Windows
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Vitalog-windows
          path: Vitalog-windows.zip
          if-no-files-found: error

      - name: Upload Linux
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Vitalog-linux
          path: Vitalog-linux.tar.gz
          if-no-files-found: error
